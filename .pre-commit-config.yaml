# Install once:  pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on all files:  pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^(docs/spec/.*\.html|packages/api-client/src/schema\.d\.ts|packages/api-client/openapi\.json|pnpm-lock\.yaml)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, chore, refactor, test, ci, perf, build, revert]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.4.1
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css]
