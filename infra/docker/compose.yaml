name: yalla

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: yalla
      POSTGRES_PASSWORD: yalla
      POSTGRES_DB: yalla
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yalla -d yalla"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../../services/api
    env_file: ../../services/api/.env.example
    environment:
      YALLA_DATABASE_URL: postgresql+asyncpg://yalla:yalla@db:5432/yalla
      YALLA_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  db-data:
