name: web

on:
  pull_request:
    paths: ["apps/web/**", "packages/**", ".github/workflows/web.yml", "pnpm-lock.yaml"]

jobs:
  build:
    name: web / typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yalla/web build
