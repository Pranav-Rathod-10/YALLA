name: api

on:
  pull_request:
    paths: ["services/api/**", ".github/workflows/api.yml", "ruff.toml", "pyproject.toml"]
  push:
    branches: [main, dev]
    paths: ["services/api/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  lint-type-test:
    name: api / lint-type-test
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yalla
          POSTGRES_PASSWORD: yalla
          POSTGRES_DB: yalla_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U yalla" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --config ../../ruff.toml .
      - run: uv run black --check --config ../../pyproject.toml .
      - run: uv run mypy app
      - name: Migrations apply cleanly and match the models
        env:
          YALLA_DATABASE_URL: postgresql+asyncpg://yalla:yalla@localhost:5433/yalla_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - run: uv run pytest -q

  docker:
    name: api / docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
